<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="maskDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable adaptive icons -->
  <rect width="512" height="512" fill="url(#maskBg)" />

  <!-- Inner safe-zone (within 80% circle) -->
  <g>
    <!-- Milk Droplet -->
    <path
      d="M256 120 C256 120, 155 250, 155 320 C155 375.228, 200.228 420, 256 420 C311.772 420, 357 375.228, 357 320 C357 250, 256 120, 256 120 Z"
      fill="url(#maskDrop)"
    />
    <!-- Light Reflection -->
    <ellipse cx="215" cy="295" rx="20" ry="40" transform="rotate(-30 215 295)" fill="#ffffff" fill-opacity="0.8" />
    <circle cx="230" cy="250" r="8" fill="#ffffff" fill-opacity="0.9" />
  </g>
</svg>
